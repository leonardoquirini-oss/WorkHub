version: '3.8'

services:
  workhub:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Obbligatorie al build (lette da .env, vedi .env.example): il Dockerfile fallisce
        # se mancano. A runtime le stesse variabili, se valorizzate in `environment`, sono
        # scritte in /config.js e hanno precedenza (nessun rebuild necessario).
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID}
        VITE_API_URL: ${VITE_API_URL}
        VITE_DEFAULT_SITE_ID: ${VITE_DEFAULT_SITE_ID}
    image: workhub:latest
    container_name: workhub
    restart: unless-stopped
    ports:
      - "${WORKHUB_PORT:-5173}:80"
    environment:
      # nginx upstream for /api (Docker network name of the BERLink backend)
      - BACKEND_URL=${BACKEND_URL:-http://backend:8080}
      # Runtime config written to /config.js (empty = keep build-time value)
      - VITE_KEYCLOAK_URL=${VITE_KEYCLOAK_URL:-}
      - VITE_KEYCLOAK_REALM=${VITE_KEYCLOAK_REALM:-}
      - VITE_KEYCLOAK_CLIENT_ID=${VITE_KEYCLOAK_CLIENT_ID:-}
      - VITE_API_URL=${VITE_API_URL:-}
      - VITE_DEFAULT_SITE_ID=${VITE_DEFAULT_SITE_ID:-}
      - TZ=Europe/Rome
    networks:
      - berlink-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  berlink-network:
    external: true
    name: berlink-dev_berlink-network
